[project]
name = "cubrid-worktree"
version = "0.1.0"
description = "Ticket-first Git worktree and Herdr workspace manager for CUBRID"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cubrid-worktree = "cubrid_worktree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubrid_worktree"]
